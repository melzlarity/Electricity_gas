<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Tracker - Eichstätt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <header class="bg-light py-3">
        <div class="container">
            <h1 class="display-5">Utility Tracker - Eichstätt</h1>
            <span class="badge bg-secondary">v1.0.0</span>
            <button onclick="exportData()" class="btn btn-primary">Export JSON</button>
            <button onclick="importData()" class="btn btn-primary">Import JSON</button>
            <button onclick="exportToPDF()" class="btn btn-primary no-print">Export to PDF</button>
        </div>
    </header>
    <div class="container mt-4">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dashboard-tab" data-bs-toggle="tab" data-bs-target="#dashboard" type="button" role="tab" aria-controls="dashboard" aria-selected="true">Dashboard</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="input-tab" data-bs-toggle="tab" data-bs-target="#input" type="button" role="tab" aria-controls="input" aria-selected="false">Data Input</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="config-tab" data-bs-toggle="tab" data-bs-target="#config" type="button" role="tab" aria-controls="config" aria-selected="false">Database & Config</button>
            </li>
        </ul>
        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="dashboard" role="tabpanel" aria-labelledby="dashboard-tab">
                <div id="electricity-accordion" class="accordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="electricity-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#electricity-collapse" aria-expanded="true" aria-controls="electricity-collapse">Strom</button>
                        </h2>
                        <div id="electricity-collapse" class="accordion-collapse collapse show" aria-labelledby="electricity-header" data-bs-parent="#electricity-accordion">
                            <div class="accordion-body">
                                <!-- Current period/month consumption, estimated cost, and configured monthly advance payment -->
                                <div id="electricity-current"></div>
                                <!-- Comparison list showing the latest reading and the previous 2 readings with their respective consumption values -->
                                <div id="electricity-comparison"></div>
                                <!-- Year-to-Date (YTD) & End-of-Year Projection -->
                                <div id="electricity-ytd"></div>
                                <!-- Responsive Chart.js bar chart visualizing consumption over time -->
                                <canvas id="electricity-chart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Repeat similar structure for Gas and Water -->
            </div>
            <div class="tab-pane fade" id="input" role="tabpanel" aria-labelledby="input-tab">
                <div id="electricity-input" class="accordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="electricity-input-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#electricity-input-collapse" aria-expanded="true" aria-controls="electricity-input-collapse">Strom</button>
                        </h2>
                        <div id="electricity-input-collapse" class="accordion-collapse collapse show" aria-labelledby="electricity-input-header" data-bs-parent="#electricity-input">
                            <div class="accordion-body">
                                <!-- Date picker -->
                                <input type="date" id="electricity-date" class="form-control" value="2023-10-01">
                                <!-- Numeric Meter Reading input -->
                                <input type="number" id="electricity-meter-reading" class="form-control" placeholder="kWh">
                                <!-- Save button -->
                                <button onclick="saveElectricityReading()" class="btn btn-primary">Save</button>
                                <!-- List of all entered readings -->
                                <div id="electricity-readings"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Repeat similar structure for Gas and Water -->
            </div>
            <div class="tab-pane fade" id="config" role="tabpanel" aria-labelledby="config-tab">
                <div id="config-section" class="accordion">
                    <div class="accordion-item">
                        <h2 class="accordion-header" id="config-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#config-collapse" aria-expanded="true" aria-controls="config-collapse">Database & Config</button>
                        </h2>
                        <div id="config-collapse" class="accordion-collapse collapse show" aria-labelledby="config-header" data-bs-parent="#config-section">
                            <div class="accordion-body">
                                <!-- Display all configured parameters in read-only input fields -->
                                <div id="config-read-only"></div>
                                <!-- Toggle for editing configuration -->
                                <button onclick="toggleConfigEdit()" class="btn btn-primary">Edit Configuration</button>
                                <!-- Clear All Data button -->
                                <button onclick="clearAllData()" class="btn btn-danger">Clear All Data</button>
                                <!-- Save Settings button -->
                                <button onclick="saveConfig()" class="btn btn-primary" style="display: none;">Save Settings</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-light py-3 mt-4">
        <div class="container">
            <p>Website developed by Melvin Pradeep in collaboration with AI</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Initialize localStorage with default configurations
        const configs = {
            electricity: {
                basePriceGross: 10.44,
                workPriceGross: 0.3315,
                monthlyAbschlag: 121.00
            },
            gas: {
                basePriceGross: 17.80,
                workPriceGross: 0.1004,
                conversionFactor: 10.7,
                monthlyAbschlag: 304.00
            },
            water: {
                monthlyAbschlag: 78.00
            }
        };
        const data = localStorage.getItem('utilityData') ? JSON.parse(localStorage.getItem('utilityData')) : { electricity: [], gas: [], water: [] };
        
        // Initialize page elements and load data from localStorage
        function init() {
            loadDashboardData();
            loadInputData();
            loadConfigData();
        }

        // Function to load dashboard data
        function loadDashboardData() {
            const electricityData = data.electricity.slice().sort((a, b) => a.date - b.date);
            if (electricityData.length > 0) {
                const latestReading = electricityData[electricityData.length - 1];
                const previousReading = electricityData[electricityData.length - 2] || {};
                const consumption = latestReading.reading - previousReading.reading;
                const cost = configs.electricity.monthlyAbschlag + (consumption * configs.electricity.workPriceGross);
                document.getElementById('electricity-current').innerHTML = `
                    <p>Current Consumption: ${consumption.toFixed(2)} kWh</p>
                    <p>Estimated Cost: ${cost.toFixed(2)} €</p>
                    <p>Monthly Abschlag: ${configs.electricity.monthlyAbschlag} €</p>
                `;
                // ... additional content for comparison and YTD/End-of-Year Projection
                // ... initialize Chart.js bar chart
            }
        }

        // Function to load input data
        function loadInputData() {
            const electricityInputs = data.electricity.map(reading => `
                <div class="accordion-item">
                    <h2 class="accordion-header" id="electricity-${reading.date}">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#electricity-${reading.date}-collapse" aria-expanded="true" aria-controls="electricity-${reading.date}-collapse">
                            Date: ${new Date(reading.date).toLocaleDateString()}
                        </button>
                    </h2>
                    <div id="electricity-${reading.date}-collapse" class="accordion-collapse collapse show" aria-labelledby="electricity-${reading.date}" data-bs-parent="#electricity-input">
                        <div class="accordion-body">
                            <p>Meter Reading: ${reading.reading.toFixed(2)} kWh</p>
                            <p>Consumption: ${reading.consumption.toFixed(2)} kWh</p>
                            <p>Cost: ${reading.cost.toFixed(2)} €</p>
                            <p>Elapsed Days: ${reading.elapsedDays}</p>
                            <button onclick="editElectricityReading(${reading.date})" class="btn btn-secondary">Edit</button>
                            <button onclick="deleteElectricityReading(${reading.date})" class="btn btn-danger">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
            document.getElementById('electricity-readings').innerHTML = electricityInputs;
        }

        // Function to load config data
        function loadConfigData() {
            document.getElementById('config-read-only').innerHTML = `
                <p>Electricity Base Price Gross: ${configs.electricity.basePriceGross.toFixed(2)} €/month</p>
                <p>Electricity Work Price Gross: ${configs.electricity.workPriceGross.toFixed(5)} €/kWh</p>
                <p>Electricity Monthly Abschlag: ${configs.electricity.monthlyAbschlag.toFixed(2)} €</p>
                <!-- Repeat for Gas and Water -->
            `;
        }

        // Function to save data to localStorage
        function saveData() {
            localStorage.setItem('utilityData', JSON.stringify(data));
        }

        // Function to export data as JSON
        function exportData() {
            const json = JSON.stringify(data);
            const downloadUrl = window.URL.createObjectURL(new Blob([json], {type: 'application/json'}));
            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'utility_data.json';
            link.click();
        }

        // Function to import data from JSON
        function importData() {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            fileInput.onchange = (event) => {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    const importedData = JSON.parse(e.target.result);
                    data.electricity = [...data.electricity, ...importedData.electricity];
                    data.gas = [...data.gas, ...importedData.gas];
                    data.water = [...data.water, ...importedData.water];
                    saveData();
                    init(); // Refresh page after import
                };
                reader.readAsText(file);
            };
            fileInput.click();
        }

        // Function to export to PDF
        function exportToPDF() {
            // Code to export content to PDF
        }

        // Function to save electricity reading
        function saveElectricityReading() {
            const date = new Date(document.getElementById('electricity-date').value);
            const reading = parseFloat(document.getElementById('electricity-meter-reading').value);
            const previousReading = data.electricity[data.electricity.length - 1];
            const consumption = reading - (previousReading ? previousReading.reading : 0);
            const cost = configs.electricity.monthlyAbschlag + (consumption * configs.electricity.workPriceGross);
            data.electricity.push({ date, reading, consumption, cost });
            saveData();
            init();
            alert('Reading saved successfully.');
        }

        // Function to edit electricity reading
        function editElectricityReading(date) {
            const reading = data.electricity.find(r => r.date === date);
            document.getElementById('electricity-date').value = new Date(reading.date).toISOString().split('T')[0];
            document.getElementById('electricity-meter-reading').value = reading.reading.toFixed(2);
        }

        // Function to delete electricity reading
        function deleteElectricityReading(date) {
            if (confirm('Are you sure you want to delete this reading?')) {
                data.electricity = data.electricity.filter(r => r.date !== date);
                saveData();
                init();
            }
        }

        // Function to toggle config edit mode
        function toggleConfigEdit() {
            const saveButton = document.querySelector('.btn-primary');
            const readOnlySection = document.getElementById('config-read-only');
            const editableInputs = document.querySelectorAll('.editable-input');
            if (saveButton.style.display === 'none') {
                saveButton.style.display = 'block';
                readOnlySection.style.display = 'none';
                editableInputs.forEach(input => input.style.display = 'block');
            } else {
                saveButton.style.display = 'none';
                readOnlySection.style.display = 'block';
                editableInputs.forEach(input => input.style.display = 'none');
            }
        }

        // Function to clear all data
        function clearAllData() {
            if (confirm('Are you sure you want to clear all data?')) {
                if (confirm('Are you absolutely sure?')) {
                    data.electricity = [];
                    data.gas = [];
                    data.water = [];
                    saveData();
                    init();
                }
            }
        }

        // Function to save config changes
        function saveConfig() {
            // Update config values from editable inputs
            configs.electricity.basePriceGross = parseFloat(document.getElementById('electricity-base-price-gross').value);
            configs.electricity.workPriceGross = parseFloat(document.getElementById('electricity-work-price-gross').value);
            configs.electricity.monthlyAbschlag = parseFloat(document.getElementById('electricity-monthly-abschlag').value);
            configs.gas.basePriceGross = parseFloat(document.getElementById('gas-base-price-gross').value);
            configs.gas.workPriceGross = parseFloat(document.getElementById('gas-work-price-gross').value);
            configs.gas.conversionFactor = parseFloat(document.getElementById('gas-conversion-factor').value);
            configs.gas.monthlyAbschlag = parseFloat(document.getElementById('gas-monthly-abschlag').value);
            configs.water.monthlyAbschlag = parseFloat(document.getElementById('water-monthly-abschlag').value);
            saveData();
            init();
            alert('Configuration saved successfully.');
        }

        // Initialize the page on load
        init();
    </script>
</body>
</html>
